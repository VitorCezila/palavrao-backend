AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Nested Stack that defines the Lambda Layers.

Parameters:
  Environment:
    Type: String
    Description: Deploy environment (dev or prod).
    Default: dev

Resources:
  PalavraoMainLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      ContentUri: ../src/lambda/layers/main
      LayerName: !Sub "palavraoApi-MainLayer-${Environment}"
      CompatibleRuntimes:
        - python3.13
    Metadata:
      BuildMethod: python3.13
      CompatibleArchitectures:
        - x86_64

Outputs:
  MainLayerARN:
    Description: "Main layer ARN"
    Value: !Ref PalavraoMainLayer